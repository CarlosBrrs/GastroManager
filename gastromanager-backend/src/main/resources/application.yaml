  default-produces-media-type: application/json



---

spring:
  config:
    activate:
      on-profile: dev

  datasource:
#    url: jdbc:postgresql://ep-red-credit-a63sdemi.us-west-2.aws.neon.tech/gastromanager-db?sslmode=require
    url: jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  ## mailsender
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          trust: "*" # not recommended for production
        auth: true
        connection-timeout: 5000
        timeout: 3000
        write-timeout: 5000
        starttls:
          enable: true
