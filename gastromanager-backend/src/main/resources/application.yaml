spring:
  servlet:
    multipart:
      max-file-size: 50MB
  application:
    name: GastroManager
    mailing:
      frontend:
        confirmation-url: http://localhost:4200/verify-account
    security:
      jwt:
        secret-key: 
        expiration: 86400000
  jpa:
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
#    show-sql: true
    hibernate:
      ddl-auto: validate
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/
    username: postgres
    password: admin
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  ## mailsender
  mail:
    host: mail-dev
    port: 1025
    username: gastromanager@mail.com
    password: gastromanager
    properties:
      mail:
        smtp:
          trust: "*" # not recommended for production
        auth: true
        connection-timeout: 5000
        timeout: 3000
        write-timeout: 5000
        starttls:
          enable: true

server:
  servlet:
    context-path: /api/v1
  port: 8080

