<main class="page-container">
  <div class="recipes-header">
    <div class="header-content">
      <div class="title-section">
        <h1>Gestión de Recetas</h1>
        <p class="subtitle">Administra las recetas de tu restaurante</p>
      </div>
      <div class="actions-section">
        <button (click)="onAddRecipe()"
                class="add-recipe-button"
                icon="pi pi-plus"
                label="Nueva Receta"
                pButton
                type="button">
        </button>
      </div>
    </div>
  </div>

  <div class="recipes-content">
    <gm-table
      (changePage)="changePageHandler($event)"
      (onRowSelect)="handleRecipeSelected($event)"
      [actions]="actions"
      [columns]="tableColumns"
      [data]="recipes()"
      [loading]="loading()"
      [selectedItem]="selectedRecipe()"
      [totalRecords]="totalRecords()">
    </gm-table>
  </div>
</main>
