<form (ngSubmit)="onSubmit()" [formGroup]="submenuForm">
  <div>
    <label for="name">Nombre:</label>
    <input formControlName="name" id="name" type="text"/>
    @if (submenuForm.get('name')?.invalid && submenuForm.get('name')?.touched) {
      <div class="error">
        Nombre es requerido y debe tener al menos 3 caracteres.
      </div>
    }
  </div>

  <div>
    <label for="description">Descripcion:</label>
    <input formControlName="description" id="description" type="text"/>
    @if (submenuForm.get('description')?.invalid && submenuForm.get('description')?.touched) {
      <div
        class="error">
        Descripcion es requerida y debe tener al menos 3 caracteres.
      </div>
    }
  </div>

  <button [disabled]="!submenuForm.valid"
          type="submit">

    {{ 'Crear submenu' }}

  </button>

        styleClass="w-4rem h-4rem"
        strokeWidth="3"
        animationDuration="1s"/>
    } @else {
      {{ 'Crear submenu' }}
    }
    </button>-->
</form>
