<gm-menus-table (onMenuSelect)="onSelectedMenuHandler($event)"
                (onSubmenuAdd)="addSubmenuHandler($event)"
                [actions]="actions"
                [columns]="tableColumns"
                [data]="menus()"
                [loading]="loading()"
                [selectedMenu]="selectedMenu()"
                [style]="{'width': '100%', 'min-height': '100%'}"
                [submenus]="submenus()"
                [totalRecords]="totalRecords()"
>
</gm-menus-table>
