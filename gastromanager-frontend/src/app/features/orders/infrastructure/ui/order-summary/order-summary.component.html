<div class="order-summary">
  <h3>Resumen de Orden</h3>

  @if (error()) {
    <div class="error-message general-error">
      {{ error() }}
    </div>
  }

  @if (orderItems().length > 0) {
    <div class="order-items-simple">
      <h4>Productos seleccionados:</h4>
      <div class="items-list">
        @for (item of orderItems(); track item.product.uuid) {
          <div class="item-container">
            <div class="item-row">
              <span class="item-name">{{ item.product.name }}</span>
              <div class="item-controls">
                <button
                  (click)="modifyQuantity(item.product.uuid, item.quantity, -1)"
                  [disabled]="item.quantity <= 1 || loading()"
                  class="qty-btn decrease"
                  type="button">
                  -
                </button>
                <span class="item-quantity">{{ item.quantity }}</span>
                <button
                  (click)="modifyQuantity(item.product.uuid, item.quantity, +1)"
                  [disabled]="loading()"
                  class="qty-btn increase"
                  type="button">
                  +
                </button>
              </div>
              <span class="item-price">${{ item.subtotal | number:'1.2-2' }}</span>
              <button
                (click)="removeItem(item.product.uuid)"
                [disabled]="loading()"
                class="remove-btn"
                title="Eliminar producto"
                type="button">
                ×
              </button>
            </div>
            <div class="item-notes">
              <input
                [disabled]="loading()"
                [id]="'notes-' + item.product.uuid"
                [placeholder]="'Notas para ' + item.product.name + '...'"
                class="notes-input"
                type="text">
            </div>
          </div>
        }
      </div>
      <div class="order-total">
        <span>Total:</span>
        <span>${{ getTotal() | number:'1.2-2' }}</span>
      </div>
    </div>
  }

  <form (ngSubmit)="onSubmitOrder()" [formGroup]="orderForm">
    <!-- Campos simples requeridos: Mesa y Cliente -->
    <div class="order-form-fields">
      <div class="form-group">
        <label for="tableNumber">Mesa</label>
        <select [disabled]="loading()" class="form-select" formControlName="tableNumber" id="tableNumber">
          <option disabled selected value="">Seleccione una mesa</option>
          @for (tableNum of [1, 2, 3, 4, 5, 999]; track tableNum) {
            <option [value]="tableNum">Mesa {{ tableNum }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="customerName">A nombre de</label>
        <input [disabled]="loading()" class="form-input" formControlName="customerName" id="customerName"
               placeholder="Nombre del cliente" type="text"/>
      </div>

      <div class="form-group">
        <label for="orderNotes">Notas generales</label>
        <textarea [disabled]="loading()" class="form-textarea" formControlName="orderNotes" id="orderNotes"
                  placeholder="Notas generales de la orden" rows="3"></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button [disabled]="!orderForm.valid || orderItems().length === 0 || loading()"
              class="btn btn-primary"
              type="submit">
        @if (loading()) {
          <p-progressSpinner
            animationDuration="1s"
            strokeWidth="3"
            styleClass="w-4rem h-4rem"/>
        } @else {
          @if (requiresPaymentBeforeOrder()) {
            Enviar Orden (Requiere Pago)
          } @else {
            Colocar Orden
          }
        }
      </button>
    </div>
  </form>
</div>
