<div class="product-filter">
  <div class="search-container">
    <input
      (input)="onSearchChange()"
      [(ngModel)]="searchTerm"
      class="search-input"
      placeholder="Buscar productos..."
      type="text">
    <button
      (click)="clearSearch()"
      *ngIf="searchTerm"
      class="clear-btn">×
    </button>
  </div>
</div>
