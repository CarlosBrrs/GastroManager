<div class="product-filter">
  <div class="search-container">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="onSearchChange()"
      placeholder="Buscar productos..."
      class="search-input">
    <button
      *ngIf="searchTerm"
      (click)="clearSearch()"
      class="clear-btn">×</button>
  </div>
</div>
