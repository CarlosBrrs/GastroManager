<div [style]="{'width': '100vw', 'height': '100vh'}" class="screen">
  <!-- Primary Sidebar -->
  <nav [class.active]="isPrimaryOpen()" class="primary-sidebar">
    <gm-primary-sidebar></gm-primary-sidebar>
    <!-- Botón de toggle para secondary dentro del primary -->
    @if (isPrimaryOpen()) {
      <button (click)="toggleSecondary()" class="toggle-btn secondary-toggle">
        ☰
      </button>
    }
  </nav>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Top Bar -->
    <header class="top-bar">
      <gm-navbar></gm-navbar>
    </header>

    <!-- Content Area -->
    <div class="content-area">
      <!-- Secondary Sidebar -->
      @if (showSecondarySidebar()) {
        <aside [class.active]="isSecondaryOpen()" [class.submenu]="!isPrimaryOpen()" class="secondary-sidebar">
          <gm-secondary-sidebar></gm-secondary-sidebar>
        </aside>
      }

      <!-- Main Content -->
      <main class="main-page-content">
        <nav class="content-header">
          <gm-content-header></gm-content-header>
        </nav>
        <div class="main-content">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</div>
