<form (ngSubmit)="handleLoginSubmit()" [formGroup]="loginForm">
  <div class="surface-ground flex align-items-center justify-content-center min-h-full min-w-full overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
      <img alt="GM-logo" class="mb-5 w-6rem flex-shrink-0" src="assets/images/gm-logo.svg">
      <div
        style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
        <div class="w-full surface-card py-5 px-5 sm:px-8" style="border-radius:53px">
          <div class="text-center mb-4">

            <div class="text-900 text-3xl font-medium mb-3">Welcome to GastroManager!</div>
            <span class="text-600 font-medium">Sign in to continue</span>
          </div>

          <div class="flex flex-column">
            <!--            <label for="email1" class="block text-900 text-lg font-medium mb-2">Username</label>-->
            <input class="w-full md:w-30rem mb-5 p-2" formControlName="username" id="email1" pInputText placeholder="Username"
                   type="text">

            <!--            <label for="password1" class="block text-900 font-medium text-lg mb-2">Password</label>-->
            <p-password [feedback]="false" [toggleMask]="true" formControlName="password" id="password1"
                        inputStyleClass="w-full p-2 md:w-30rem" placeholder="Password" styleClass="mb-5"></p-password>

            <div class="flex align-items-center justify-content-between mb-5 gap-5">
              <div class="flex align-items-center">
                <p-checkbox [binary]="true" id="rememberme1" styleClass="mr-2"></p-checkbox>
                <label for="rememberme1">Remember me</label>
              </div>
              <a class="font-medium no-underline ml-2 text-right cursor-pointer" style="color: var(--primary-color)">Forgot
                password?</a>
            </div>
            <button [disabled]="this.loginForm.invalid" class="w-full p-2 text-xl" label="Sign In" pButton pRipple
                    type="submit"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</form>
